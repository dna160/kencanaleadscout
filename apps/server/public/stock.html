<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Stok</title>
<style>
  /* ── Inherited design system (CONTRACTS §6, UX-SPEC §1.1) ──────────────────
     Carried forward byte for byte from stock 1.0. Additive changes only. */
  :root{
    --bg:#f2f4f7; --card:#fff; --ink:#17233b; --muted:#6b7280; --line:#e5e7eb;
    --accent:#157a46; --danger:#c03c2b;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  :root{
    /* Stock 2.0 additions — see UX-SPEC §1.2. Additive only. */
    --ink-2:#475569;            /* secondary numerals; --muted is too weak here */
    --ok-bg:#dcfce7;   --ok-ink:#15803d;
    --warn-bg:#fef3c7; --warn-ink:#b45309; --warn-line:#fde68a; --warn-ink-strong:#7a4f08;
    --neg-bg:#fee2e2;  --neg-ink:#b91c1c;
    --neutral-bg:#f3f4f6; --neutral-ink:#4b5563;
    --offline-bg:#eef1f6; --offline-ink:#334155; --offline-line:#cbd5e1;
    --age-old-bg:#ffedd5;     --age-old-ink:#9a3412;
    --age-ancient-bg:#fee2e2; --age-ancient-ink:#b91c1c;
    --focus:#1d4ed8;
    --tap:44px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:40px}
  header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:12px 16px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:960px;margin:0 auto}
  header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
  header .sub{font-size:12px;color:#c7cfde;margin-top:2px}
  header a.pplink{color:#ffd27a;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}
  .wrap{max-width:960px;margin:0 auto;padding:14px 16px}
  label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
  select,input[type=text],input[type=number],textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:44px}
  select{min-width:180px}
  .banner{background:#fef3c7;color:#7a4f08;border:1px solid #fde68a;border-radius:12px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;line-height:1.45}
  .banner button{margin-left:auto;background:none;border:none;color:#7a4f08;font-size:18px;cursor:pointer;line-height:1;padding:0 4px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .toolbar input[type=text]{flex:1;min-width:140px}
  /* Filter selects share rows instead of one-per-line at 380px — the point of
     these controls is less scrolling, so the toolbar must not add its own. */
  .toolbar select{min-width:0;flex:1 1 46%}
  .chkline{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;min-height:44px}
  .chkline input{width:18px;height:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
  .card h2{font-size:14px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);background:#fafbfc;display:flex;justify-content:space-between;align-items:center;gap:8px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;background:#fafbfc}
  tr.itemrow{cursor:pointer}
  tr.itemrow:hover{background:#f7fafc}
  .warna b{font-size:14px}
  .sub2{color:var(--muted);font-size:11px;margin-top:2px}
  .avail{font-weight:800;font-size:14px;white-space:nowrap}
  .avail.neg{color:var(--danger)}
  .m2{color:var(--muted);font-size:11px;font-weight:500}
  .chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .chip.age{background:#f3f4f6;color:#6b7280}
  /* Booking-era status chips: CSS kept per UX-SPEC §1.1, but NO element on this
     page carries them — the features they named no longer exist. */
  .st-confirmed{background:#dcfce7;color:#15803d}
  .st-overbooked{background:#fef3c7;color:#b45309}
  .st-approved{background:#ede9fe;color:#6d28d9}
  .st-rejected{background:#fee2e2;color:#b91c1c}
  .st-cancelled{background:#f3f4f6;color:#6b7280}
  .st-completed{background:#dbeafe;color:#1d4ed8}
  .st-outstanding{background:#ffedd5;color:#c2410c}
  button.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:0 14px;min-height:40px;font-weight:700;font-size:13px;cursor:pointer}
  button.btn:disabled{opacity:.55;cursor:default}
  button.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  button.btn.danger{background:#fff;color:var(--danger);border:1px solid #f3c9c2}
  button.mini{padding:0 10px;min-height:34px;font-size:12px;border-radius:8px}
  .empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
  .empty a{color:var(--accent);font-weight:700}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:0}
  .modal-bg.on{display:flex}
  .modal{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;padding:16px}
  @media(min-width:560px){.modal-bg{align-items:center;padding:16px}.modal{border-radius:16px}}
  .modal h3{margin:0 0 4px;font-size:17px}
  .modal .mp{color:var(--muted);font-size:12px;margin:0 0 14px}
  .modal .actions{display:flex;gap:10px;margin-top:16px}
  .modal .actions .btn{flex:1;min-height:46px}
  .big-avail{font-size:15px;font-weight:800;margin:10px 0}
  .big-avail.neg{color:var(--danger)}
  .hint{font-size:12px;color:#b45309;background:#fef3c7;border-radius:8px;padding:6px 10px;margin-top:6px}
  .rev{text-decoration:line-through;opacity:.6}
  .sisa{text-align:right;font-weight:700;white-space:nowrap}
  .foot{font-size:12px;color:var(--muted);padding:10px 4px 0}
  /* toast */
  #toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:420px}
  .toast{background:var(--ink);color:#fff;padding:12px 14px;border-radius:12px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .25s ease}
  .toast.ok{background:#166534}.toast.warn{background:#b45309}.toast.err{background:var(--danger)}
  @keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ── New classes — UX-SPEC §1.3. Defined only from tokens. ──────────────── */
  /* ST-R10 state chips */
  .st-tersedia      {background:var(--ok-bg);      color:var(--ok-ink)}
  .st-habis         {background:var(--warn-bg);    color:var(--warn-ink)}
  .st-kosong        {background:var(--neutral-bg); color:var(--neutral-ink)}
  .st-perlu-produksi{background:var(--neg-bg);     color:var(--neg-ink)}
  /* age pill, three tiers */
  .chip.umur        {background:var(--neutral-bg); color:var(--neutral-ink)}
  .chip.umur.old    {background:var(--age-old-bg); color:var(--age-old-ink)}
  .chip.umur.ancient{background:var(--age-ancient-bg); color:var(--age-ancient-ink)}
  /* the headline number (UX-SPEC §2) */
  .atp      {font-size:22px;font-weight:800;line-height:1.05;white-space:nowrap;
             font-variant-numeric:tabular-nums;color:var(--ink)}
  .atp.neg  {color:var(--danger)}
  .atp .un  {font-size:12px;font-weight:700;color:var(--ink-2);margin-left:4px}
  .atp-m2   {font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}
  .atp-sub  {font-size:11px;color:var(--ink-2);margin-top:3px;
             font-variant-numeric:tabular-nums;line-height:1.35}
  .atp-note {font-size:11px;color:var(--ink-2);margin-top:3px;line-height:1.35}
  /* the offline (ERP not configured) box — deliberately NOT amber */
  .offbox{background:var(--offline-bg);border:1px solid var(--offline-line);
          color:var(--offline-ink);border-radius:12px;padding:12px 14px;
          font-size:13px;line-height:1.45;display:flex;gap:10px;
          align-items:flex-start;margin-bottom:12px}
  /* A fourth connection state needs a fourth look. The three families now read:
     slate = the integration is switched off · amber = the data may be old ·
     red = something is broken that a person has to fix, and waiting will not
     fix it. Tokens only (--neg-bg / --neg-ink, the inherited .st-rejected pair,
     5.30:1), no new hex. */
  .alarmbox{background:var(--neg-bg);border:1px solid var(--neg-ink);
            color:var(--neg-ink);border-radius:12px;padding:12px 14px;
            font-size:13px;line-height:1.45;display:flex;gap:10px;
            align-items:flex-start;margin-bottom:12px;font-weight:600}
  /* ── filter chip row + totals strip — CANONICAL, byte-identical on both pages
        (UX-SPEC §1.3; closes the CONTRACTS "Open" divergence note). The
        aria-selected arm is inert here — this page's chips are aria-pressed
        toggles — but it is carried so the two blocks cannot drift again. ─── */
  .fltchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .fchip{border:1px solid var(--line);background:var(--card);color:var(--ink-2);
         border-radius:999px;padding:0 12px;min-height:var(--tap);font:inherit;
         font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;
         align-items:center;gap:6px}
  .fchip[aria-pressed="true"],
  .fchip[aria-selected="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
  .fchip:disabled{opacity:.55;cursor:default}
  .fchip .n{font-variant-numeric:tabular-nums;font-weight:800}
  /* skeleton */
  .sk{background:var(--line);border-radius:6px;height:12px;animation:skp 1.1s ease-in-out infinite}
  .sk.lg{height:20px}
  @keyframes skp{0%,100%{opacity:.55}50%{opacity:1}}
  /* poll delta flash */
  @keyframes flup{from{background:var(--ok-bg)}to{background:transparent}}
  @keyframes fldn{from{background:var(--neg-bg)}to{background:transparent}}
  .f-up{animation:flup 1.2s ease-out}
  .f-dn{animation:fldn 1.2s ease-out}
  /* a11y */
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
           overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
  header :focus-visible{outline-color:var(--card)}
  .btn.tap{min-height:var(--tap)}
  .mini.tap{min-height:var(--tap);padding:0 12px}

  /* ── Row layout: table ≥560px, two-column cards ≤559px (UX-SPEC §2.2) ───── */
  td.prod{min-width:0}
  td.num{text-align:right;white-space:nowrap}
  td.num .atp-sub,td.num .atp-note,td.num .atp-m2{white-space:normal}
  @media(max-width:559px){
    table.items thead{display:none}
    table.items,table.items tbody,table.items tr,table.items td{display:block;width:100%}
    table.items tr.itemrow{display:flex;gap:12px;align-items:flex-start;
      justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
    table.items td{border:none;padding:0}
    table.items td.prod{flex:1 1 auto}
    table.items td.num{flex:0 0 auto;max-width:52%}
    table.items tr.norows td{padding:0}
  }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div>
      <h1>Stok</h1>
      <!-- Freshness is always visible, never behind a tap (UX-SPEC §4.1). -->
      <div class="sub" id="dataPer" role="status">Memuat…</div>
    </div>
    <a class="pplink" href="/stock-ppic">PPIC ↗</a>
  </div>
</header>

<div class="wrap">
  <!-- Three conditions, three looks, mutually exclusive (UX-SPEC §4):
       offline box ▸ amber stale banner ▸ freshness line only. -->
  <div class="offbox" id="offBox" role="status" style="display:none">
    <span aria-hidden="true">🔌</span>
    <div>
      <b>ERP tidak terhubung.</b><br>
      <span id="offText"></span>
    </div>
  </div>

  <!-- State 4: configured and reachable, but the ERP is rejecting our
       credentials. This is NOT "tidak terhubung" — the fix is an admin action,
       not a wait — so it gets its own colour family and its own copy. -->
  <div class="alarmbox" id="authBox" role="status" style="display:none">
    <span aria-hidden="true">🔒</span>
    <div>
      <b>Akses ERP ditolak.</b><br>
      <span id="authText"></span>
    </div>
  </div>

  <div class="banner" id="staleBanner" role="status" style="display:none">
    <span aria-hidden="true">⚠️</span>
    <span id="staleText"></span>
  </div>

  <div id="stateArea"></div>

  <div id="listArea" style="display:none">
    <div class="fltchips" id="totals"></div>
    <div class="toolbar">
      <label class="sr-only" for="q">Cari warna atau kode barang</label>
      <input type="text" id="q" placeholder="Cari warna / kode barang…" />
      <label class="sr-only" for="kode">Kode Barang</label>
      <select id="kode" title="Kode Barang"><option value="">Semua kode</option></select>
      <label class="sr-only" for="warna">Warna</label>
      <select id="warna" title="Warna"><option value="">Semua warna</option></select>
      <label class="sr-only" for="th">Tebal</label>
      <select id="th" title="Tebal"><option value="">Semua tebal</option></select>
      <label class="sr-only" for="size">Ukuran</label>
      <select id="size" title="Ukuran (P×L)"><option value="">Semua ukuran</option></select>
      <label class="sr-only" for="sort">Urutkan</label>
      <select id="sort" title="Urutkan">
        <option value="warna">Urut: Warna A–Z</option>
        <option value="kode">Urut: Kode Barang</option>
        <option value="atp_desc">Urut: Bisa dijual terbanyak</option>
        <option value="atp_asc">Urut: Bisa dijual paling sedikit</option>
        <!-- nearest_eta is the nearest OUTBOUND commitment date, never incoming
             supply — the label must not read as a restock date on any row. -->
        <option value="eta">Urut: Pengiriman pesanan terdekat</option>
      </select>
      <label class="chkline"><input type="checkbox" id="hz" /> Sembunyikan yang kosong</label>
    </div>
    <div class="card">
      <h2>Daftar Produk <span class="chip umur" id="invMeta">—</span></h2>
      <div style="overflow-x:auto"><table class="items">
        <thead><tr><th>Produk</th><th style="text-align:right">Bisa Dijual</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table></div>
    </div>
  </div>
</div>

<!-- Detail per SKU (CONTRACTS §4.2). Read-only: the only interaction left. -->
<div class="modal-bg" id="dtBg">
  <div class="modal" id="dtModal" role="dialog" aria-modal="true"></div>
</div>

<div id="toast"></div>

<script>
"use strict";
const $ = (s,r=document)=>r.querySelector(s);
const eq = (a,b)=>String(a)===String(b);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// ── Number / date formatting — UX-SPEC §1.4, identical on both pages ─────────
const NF  = new Intl.NumberFormat("id-ID",{maximumFractionDigits:2});   // inherited
const num = n => NF.format(Number(n)||0).replace("-","−");         // U+2212 MINUS
const N   = v => { const x=Number(v); return Number.isFinite(x)?x:0; }; // arithmetic only

function toDate(v){
  if(!v) return null;
  // Date-only values (estimate_delivery, nearest_eta) are WIB calendar dates.
  const d=new Date(/^\d{4}-\d{2}-\d{2}$/.test(String(v))?String(v)+"T00:00:00+07:00":v);
  return isNaN(d)?null:d;
}
function wib(iso,withDate=true){            // inherited
  const d=toDate(iso); if(!d) return "—";
  const opt=withDate
    ? {day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Jakarta"}
    : {hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Jakarta"};
  return new Intl.DateTimeFormat("id-ID",opt).format(d).replace(/\./g,":").replace(/:(\w{3}):/," $1 ");
}
function jakYear(d){ return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Jakarta",year:"numeric"}).format(d); }
// Inherited wibShort(), extended with an optional year — a 2020 ETA reading
// "27 Agu" is the single most misleading thing we could print (UX-SPEC §1.4).
function wibShort(iso,withYear){
  const d=toDate(iso); if(!d) return "—";
  if(withYear===undefined) withYear = jakYear(d)!==jakYear(new Date());
  const opt={day:"2-digit",month:"short",timeZone:"Asia/Jakarta"};
  if(withYear) opt.year="numeric";
  return new Intl.DateTimeFormat("id-ID",opt).format(d);
}
// Relative freshness: baru saja / N mnt lalu / N jam lalu / absolute beyond 24h.
function relFresh(iso){
  const d=toDate(iso); if(!d) return null;
  const s=Math.max(0,(Date.now()-d.getTime())/1000);
  if(s<60) return "baru saja";
  if(s<3600) return Math.floor(s/60)+" mnt lalu";
  if(s<86400) return Math.floor(s/3600)+" jam lalu";
  return null;                                  // beyond 24h → absolute only
}

function toast(msg,kind){
  const t=document.createElement("div");
  t.className="toast"+(kind?(" "+kind):"");
  t.textContent=msg;
  $("#toast").appendChild(t);
  setTimeout(()=>t.remove(),3500);
}

// ── Domain vocabulary — UX-SPEC §1.5 + §3. One word per concept, both pages ──
const STATES=["tersedia","habis","kosong","perlu_produksi"];
const ST_CLASS={tersedia:"st-tersedia",habis:"st-habis",kosong:"st-kosong",perlu_produksi:"st-perlu-produksi"};
const ST_SHORT={tersedia:"Tersedia",habis:"Habis",kosong:"Kosong",perlu_produksi:"Perlu Produksi"};
const ST_LONG ={tersedia:"Tersedia",habis:"Habis (Semua Dipesan)",kosong:"Kosong",perlu_produksi:"Perlu Produksi"};
function stateNote(i){
  switch(i.state){
    case "tersedia": return "Masih bisa dijual sekarang.";
    case "habis":    return "Stok fisik ada, tapi seluruhnya sudah dipesan Sales Order lain.";
    case "kosong":   return "Tidak ada stok fisik di gudang.";
    case "perlu_produksi":
      // The deficit restated as a positive number — "berapa yang harus dibuat"
      // is the question, and subtracting a minus in your head is an error source.
      return `Pesanan melebihi stok. Kekurangan ${num(Math.abs(N(i.atp)))} ${i.unit||""}`.trim()+".";
    default: return "";
  }
}
function stateChip(state,long){
  const k=STATES.includes(state)?state:null;
  if(!k) return "";
  return `<span class="chip ${ST_CLASS[k]}">${esc(long?ST_LONG[k]:ST_SHORT[k])}</span>`;
}

/* ── `warna` is an ID, not a name ─────────────────────────────────────────────
   SO and stock rows carry `warna` as a numeric code (e.g. 4) into a colour
   master whose `rm_warna` holds the name ("BLACK GALAXY"). Printing the code
   puts "4" where a rep expects the single most important label on the screen.
   The back end resolves it into `warna_name` (= coalesce(warna_text, the
   tbl_1228 colour master's rm_warna)) and into `name`; this renders whichever
   has arrived and, when none has, falls back to the code LABELLED as a code —
   a bare number never stands in for a product name. Correct before and after
   the back-end change lands. */
const txt = v => (v==null?"":String(v)).trim();
const isKode = v => /^[0-9]+$/.test(v);          // "4", "004" — a master-data id
function warnaFromName(i){
  // Server idiom (composeName): "{kode} {warna} {th} · {p}×{l}". Strip the parts
  // we already hold as fields and whatever is left is the colour. If the strip
  // does not bite we keep the fuller name — long but true — never the code.
  let v=txt(i.name);
  if(!v || v===txt(i.sku_key)) return "";        // nameless fallback, not a name
  const dot=v.indexOf(" · "); if(dot>=0) v=v.slice(0,dot);
  const kode=txt(i.kode_barang);
  if(kode && v.toLowerCase().startsWith(kode.toLowerCase())) v=v.slice(kode.length).trim();
  const th=i.th!=null?String(i.th):"";
  if(th && v.toLowerCase().endsWith(th.toLowerCase())) v=v.slice(0,v.length-th.length).trim();
  return v;
}
function warnaLabel(i){
  if(!i) return "—";
  const t=txt(i.warna_name)||txt(i.warna_text); if(t && !isKode(t)) return t;
  const w=txt(i.warna);      if(w && !isKode(w)) return w;
  const fromName=warnaFromName(i); if(fromName && !isKode(fromName)) return fromName;
  const code=t||w||fromName;
  if(code) return "Kode warna "+code;            // never a bare number
  return txt(i.name)||txt(i.sku_key)||"—";
}

/* ── The five connection states — UX-SPEC §4 precedence, extended ─────────────
   1 tidak terhubung  SELARAS_BASE_URL unset          → slate box   (suppresses all)
   2 akses ditolak    reachable, credentials rejected → red box     (admin action)
   3 sinkronisasi gagal  last attempt errored         → amber banner (we know why)
   4 kedaluwarsa      no success in N intervals       → amber banner (only: old)
   5 sehat                                            → freshness line only
   Exactly one renders, highest first. 2 and 3 come from /api/stock/sync-status;
   1 and 4 stay where the contract puts them, on /summary's freshness block. */
let SYNC=null;        // last /sync-status payload that arrived, or null
let WAS_CONN=null;    // to announce a recovery exactly once
// The ERP client writes "HTTP 401 from ERP" / "HTTP 403 from ERP" into
// last_error verbatim. Until the server classifies auth failures itself this is
// the only way to tell "wrong credentials" from "the ERP fell over" — and the
// two need opposite instructions. Anything it does not match degrades to
// state 3, which is the honest answer when we cannot tell.
const AUTH_RE=/\bHTTP\s*(401|403)\b|\b(unauthorized|forbidden)\b/i;
function normSync(j){
  const o=j&&typeof j==="object"?j:{};
  const f=o.freshness&&typeof o.freshness==="object"?o.freshness:{};
  const tbl=Array.isArray(o.tables)?o.tables:[];
  return {
    root:o, freshness:f,
    tables:tbl.map(t=>({
      table_name:txt(t&&t.table_name),
      last_error:txt(t&&t.last_error),
      last_error_at:(t&&t.last_error_at)||null,
      last_ok_at:(t&&t.last_ok_at)||null,
    })),
  };
}
function authRejected(){
  if(!SYNC) return false;
  // An explicit server signal wins if one ever lands. Nothing is invented:
  // absent means "unknown", which falls through to the text probe below.
  for(const k of ["erp_authorized","authorized"])
    if(SYNC.freshness[k]===false || SYNC.root[k]===false) return true;
  for(const k of ["erp_auth_failed","auth_failed","unauthorized"])
    if(SYNC.freshness[k]===true || SYNC.root[k]===true) return true;
  return SYNC.tables.some(t=>AUTH_RE.test(t.last_error));
}
// The worker clears last_error on a successful table pull, so a message that is
// still there means that table's most recent attempt failed.
function syncFailing(){ return !!(SYNC && SYNC.tables.some(t=>t.last_error!=="")); }
function connState(){
  const f=(SUMMARY&&SUMMARY.freshness)||{};
  if(f.erp_connected===false) return "off";
  if(authRejected()) return "auth";
  if(syncFailing())  return "failing";
  if(f.stale===true) return "stale";
  return "ok";
}

// ── state ─────────────────────────────────────────────────────────────────────
// SUMMARY holds the last payload that actually arrived. A failed poll never
// blanks the table — the rep keeps reading the last known numbers (ST-R7).
let SUMMARY=null;
let FIRSTLOAD=true;      // no successful load yet → skeleton
let LASTERR="";          // last fetch failure
let RELOAD_FAILED=false; // a poll failed while old data is still on screen
let WAS_STALE=false;     // to announce recovery exactly once (UX-SPEC §4.2)
const PREV_ATP=new Map();// sku_key → last atp, for the delta flash
let FLASH=new Map();     // sku_key → "f-up" | "f-dn", consumed by the next render

const flt={
  q:"", kode:"", warna:"", th:"", size:"", state:"",
  sort:localStorage.getItem("stk_sort")||"warna",
  // Never defaulted on: UX-SPEC §2.3 forbids a filter default that hides rows.
  hideZero:localStorage.getItem("stk_hz")==="1",
};
$("#sort").value=flt.sort;
$("#hz").checked=flt.hideZero;

// ── fetch (ST-R15: same URL as 1.0) ───────────────────────────────────────────
async function loadSummary(){
  try{
    const r=await fetch("/api/stock/summary",{headers:{accept:"application/json"}});
    let j=null;
    try{ j=await r.json(); }catch{ j=null; }
    if(!r.ok){
      LASTERR=(j&&j.error)||(r.status===503?"Database tidak tersedia.":"Gagal memuat data stok.");
      RELOAD_FAILED=!!SUMMARY;
      if(SUMMARY) toast(LASTERR,"err");   // keep showing the old numbers
      FIRSTLOAD=false; renderAll(); return;
    }
    LASTERR=""; RELOAD_FAILED=false;
    const next=normalize(j);
    markDeltas(next);
    if(WAS_STALE && !next.freshness.stale && next.freshness.erp_connected){
      toast("Data ERP sudah diperbarui.","ok");
    }
    WAS_STALE=next.freshness.stale;
    SUMMARY=next;
  }catch{
    LASTERR="Gagal terhubung ke server.";
    RELOAD_FAILED=!!SUMMARY;
    if(SUMMARY) toast("Gagal memuat ulang. Menampilkan data terakhir.","warn");
  }
  FIRSTLOAD=false;
  renderAll();
}
/* /sync-status is the only place states 2 and 3 are visible. It is a three-row
   payload, so it is cheap next to /summary; it polls on its own 60s tick rather
   than doubling the round trips a rep makes on a 3G handset. A failure here is
   silent by design — an unknown sync state must never put a new claim on
   screen, it just leaves the page rendering states 1 / 4 / 5 as before. */
async function loadSync(){
  try{
    const r=await fetch("/api/stock/sync-status",{headers:{accept:"application/json"}});
    if(r.ok){ SYNC=normSync(await r.json()); }
  }catch{ /* keep the last known sync state */ }
  const now=connState();
  if((WAS_CONN==="failing"||WAS_CONN==="auth") && (now==="ok"||now==="stale")){
    toast("Sinkronisasi ERP kembali normal.","ok");
  }
  WAS_CONN=now;
  if(SUMMARY) renderFreshness();
}

// Defensive only — the page must not explode if a field is absent while the
// back end is still landing. No field is invented: missing stays missing.
function normalize(j){
  const o=j&&typeof j==="object"?j:{};
  const f=o.freshness&&typeof o.freshness==="object"?o.freshness:{};
  return {
    freshness:{
      last_ok_at:f.last_ok_at??null,
      stale:f.stale===true,
      erp_connected:f.erp_connected!==false,
    },
    totals:o.totals&&typeof o.totals==="object"?o.totals:{},
    items:Array.isArray(o.items)?o.items:[],
  };
}
// Which numbers moved under the reader since the last poll (UX-SPEC §1.3 flash).
function markDeltas(next){
  const f=new Map();
  for(const i of next.items){
    const k=String(i.sku_key), a=N(i.atp), p=PREV_ATP.get(k);
    if(p!=null && p!==a) f.set(k, a>p ? "f-up" : "f-dn");
    PREV_ATP.set(k,a);
  }
  if(f.size) FLASH=f;
}

// ── render orchestration ──────────────────────────────────────────────────────
function renderAll(){
  renderFreshness();
  const host=$("#stateArea"), list=$("#listArea");

  if(FIRSTLOAD && !SUMMARY){
    list.style.display="none";
    $("#offBox").style.display="none";
    host.innerHTML=skeleton();
    return;
  }
  if(!SUMMARY){
    list.style.display="none";
    $("#offBox").style.display="none";
    host.innerHTML=`<div class="card"><div class="empty">
      Data stok gagal dimuat.<br>${esc(LASTERR||"Coba lagi sebentar.")}
      <div style="margin-top:12px"><button class="btn tap" id="retry">Coba lagi</button></div></div></div>`;
    $("#retry").addEventListener("click",()=>{ FIRSTLOAD=true; renderAll(); loadSummary(); });
    return;
  }

  const items=SUMMARY.items, off=!SUMMARY.freshness.erp_connected;
  if(off){
    $("#offText").textContent = items.length
      ? "Angka di bawah adalah data terakhir sebelum koneksi dimatikan dan tidak lagi diperbarui."
      : "Integrasi ke sistem ERP belum diaktifkan, jadi angka stok belum bisa ditampilkan. Hubungi tim IT untuk mengaktifkan.";
    $("#offBox").style.display="";
  }else{
    $("#offBox").style.display="none";
  }

  if(items.length===0){
    list.style.display="none";
    host.innerHTML=off
      ? `<div class="card"><div class="empty">Data stok belum tersedia.<br>Halaman ini akan terisi otomatis setelah ERP terhubung.</div></div>`
      : `<div class="card"><div class="empty">Data stok belum tersedia.<br>Sinkronisasi ERP belum menghasilkan baris stok.</div></div>`;
    return;
  }
  host.innerHTML="";
  list.style.display="";
  setDisabled(off);
  syncFilterOptions();
  renderTotals();
  renderRows();
}
function skeleton(){
  const bar=(w,cls)=>`<div class="sk ${cls||""}" style="width:${w}"></div>`;
  const row=()=>`<div style="padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;justify-content:space-between">
    <div style="flex:1"><div class="sk" style="width:62%;height:14px"></div><div class="sk" style="width:44%;margin-top:8px"></div></div>
    <div style="flex:0 0 40%"><div class="sk lg" style="width:80%;margin-left:auto"></div><div class="sk" style="width:60%;margin-top:8px;margin-left:auto"></div></div>
  </div>`;
  return `<div class="toolbar">${bar("100%","lg")}</div>
    <div class="card"><h2>Daftar Produk</h2>${row()}${row()}${row()}${row()}</div>
    <span class="sr-only" role="status">Memuat data stok…</span>`;
}
// ERP off ⇒ controls are disabled, never hidden: hiding them makes the page look
// broken, disabling makes it look switched off (UX-SPEC §4.3).
function setDisabled(off){
  ["#q","#kode","#warna","#th","#size","#sort","#hz"].forEach(s=>{
    const el=$(s); if(!el) return;
    el.disabled=off;
    if(off) el.setAttribute("title","ERP tidak terhubung"); else el.removeAttribute("title");
  });
}

function renderFreshness(){
  const el=$("#dataPer"), banner=$("#staleBanner"), authBox=$("#authBox");
  if(!SUMMARY){
    el.textContent=LASTERR?"Data stok gagal dimuat":"Memuat…";
    banner.style.display="none"; authBox.style.display="none"; return;
  }
  const f=SUMMARY.freshness, st=connState();

  // The freshness line renders in every state, with different text (§4.1).
  if(st==="off"){ el.textContent="ERP tidak terhubung"; }
  else if(st==="auth"){ el.textContent="Akses ERP ditolak"; }
  else if(!f.last_ok_at){
    el.textContent = st==="failing" ? "Sinkronisasi ERP gagal" : "Menunggu sinkronisasi pertama…";
  }else{
    const rel=relFresh(f.last_ok_at);
    const head="Data ERP per "+(rel?wib(f.last_ok_at,false):wib(f.last_ok_at));
    el.textContent = RELOAD_FAILED ? head+" · gagal memuat ulang"
      : st==="failing" ? head+" · sinkronisasi gagal"
      : (rel?head+" · "+rel:head);
  }

  // Exactly one box or banner, highest state first. #offBox is owned by
  // renderAll(); the two here are cleared first so no pair can ever coexist.
  authBox.style.display="none"; banner.style.display="none";
  if(st==="off") return;                       // slate box wins, and it alone
  if(st==="auth"){
    authBox.style.display="";
    // Retrying is not the fix and must not be suggested: the credential is
    // rejected until an administrator replaces it.
    $("#authText").textContent =
      "Sistem ERP menolak kredensial LeadScout, jadi angka stok berhenti diperbarui. "+
      "Menunggu atau memuat ulang halaman tidak akan memperbaikinya — hubungi tim IT. "+
      "Sementara itu, konfirmasi ke PPIC sebelum menjanjikan stok.";
    return;
  }
  if(st==="failing"){
    // Distinct from stale on purpose. Stale says only "the data is old";
    // this says we know the sync itself is failing, and since when.
    banner.style.display="";
    $("#staleText").innerHTML = f.last_ok_at
      ? `Sinkronisasi ERP gagal. Angka di bawah adalah data terakhir yang berhasil diambil, per <b>${esc(wib(f.last_ok_at,!relFresh(f.last_ok_at)))}</b> — konfirmasi ke PPIC sebelum menjanjikan stok.`
      : `Sinkronisasi ERP gagal dan belum pernah berhasil. Angka stok belum bisa dipakai — konfirmasi ke PPIC sebelum menjanjikan stok.`;
    return;
  }
  if(st==="stale"){
    banner.style.display="";
    $("#staleText").innerHTML = f.last_ok_at
      ? `Data ERP belum diperbarui sejak <b>${esc(wib(f.last_ok_at,!relFresh(f.last_ok_at)))}</b>. Angka di bawah mungkin sudah tidak akurat — konfirmasi ke PPIC sebelum menjanjikan stok.`
      : `Sinkronisasi ERP belum pernah berhasil. Angka di bawah mungkin sudah tidak akurat — konfirmasi ke PPIC sebelum menjanjikan stok.`;
  }
}
// The relative half re-renders on a client tick, without refetching.
setInterval(()=>{ if(SUMMARY) renderFreshness(); },30000);

// ── filter option lists ───────────────────────────────────────────────────────
// Rebuilt only when the underlying option set changes, so a poll never steals
// focus from the search box or resets an open dropdown.
function sizeKey(i){ return (i.p!=null&&i.l!=null)?`${i.p}x${i.l}`:""; }
const optSig={};
function syncSelect(id,opts,cur,placeholder){
  const sel=$("#"+id);
  const sig=opts.map(o=>o.v).join("");
  if(optSig[id]!==sig){
    optSig[id]=sig;
    sel.innerHTML=`<option value="">${esc(placeholder)}</option>`+
      opts.map(o=>`<option value="${esc(o.v)}">${esc(o.label)}</option>`).join("");
  }
  sel.value=cur;
  if(sel.value!==cur) sel.value="";       // an option that vanished resets cleanly
  sel.style.display=opts.length?"":"none";
}
function syncFilterOptions(){
  const items=SUMMARY.items;
  const byId=(a,b)=>String(a).localeCompare(String(b),"id",{sensitivity:"base"});
  const kodes=[...new Set(items.map(i=>i.kode_barang).filter(Boolean))].sort(byId);
  // Keyed on the DISPLAYED colour, not the raw code — otherwise the filter
  // reads "4 · 12 · 37" and sorts by id instead of alphabetically by name.
  const warnas=[...new Set(items.map(warnaLabel).filter(v=>v&&v!=="—"))].sort(byId);
  const ths=[...new Set(items.map(i=>i.th).filter(v=>v!=null))].sort((a,b)=>N(a)-N(b));
  const sizes=[...new Set(items.map(sizeKey).filter(Boolean))]
    .sort((a,b)=>{const[ap,al]=a.split("x").map(Number),[bp,bl]=b.split("x").map(Number);return ap-bp||al-bl;});
  syncSelect("kode",kodes.map(v=>({v,label:v})),flt.kode,"Semua kode");
  syncSelect("warna",warnas.map(v=>({v,label:v})),flt.warna,"Semua warna");
  syncSelect("th",ths.map(v=>({v:String(v),label:num(v)+" mm"})),flt.th,"Semua tebal");
  syncSelect("size",sizes.map(v=>{const[a,b]=v.split("x");return {v,label:`${num(a)}×${num(b)}`};}),flt.size,"Semua ukuran");
  flt.kode=$("#kode").value; flt.warna=$("#warna").value; flt.th=$("#th").value; flt.size=$("#size").value;
}

$("#q").addEventListener("input",e=>{flt.q=e.target.value;renderRows();});
$("#kode").addEventListener("change",e=>{flt.kode=e.target.value;renderRows();});
$("#warna").addEventListener("change",e=>{flt.warna=e.target.value;renderRows();});
$("#th").addEventListener("change",e=>{flt.th=e.target.value;renderRows();});
$("#size").addEventListener("change",e=>{flt.size=e.target.value;renderRows();});
$("#sort").addEventListener("change",e=>{flt.sort=e.target.value;localStorage.setItem("stk_sort",flt.sort);renderRows();});
$("#hz").addEventListener("change",e=>{flt.hideZero=e.target.checked;localStorage.setItem("stk_hz",flt.hideZero?"1":"0");renderRows();});

// ── totals strip, doubling as the state filter ────────────────────────────────
function renderTotals(){
  const t=SUMMARY.totals||{}, off=!SUMMARY.freshness.erp_connected;
  const parts=STATES.map(s=>
    `<button type="button" class="fchip" data-state="${s}" aria-pressed="${flt.state===s?"true":"false"}" ${off?"disabled":""}>`+
    `${esc(ST_SHORT[s])} <span class="n">${num(t[s])}</span></button>`);
  if(N(t.stale_commitments)>0){
    parts.push(`<span class="chip umur" title="Pesanan lama tidak mengurangi Bisa Dijual">Pesanan lama ${num(t.stale_commitments)}</span>`);
  }
  const el=$("#totals");
  el.innerHTML=parts.join("");
  el.querySelectorAll("[data-state]").forEach(b=>b.addEventListener("click",()=>{
    const s=b.getAttribute("data-state");
    flt.state = flt.state===s ? "" : s;
    renderTotals(); renderRows();
  }));
}

/**
 * Search relevance, carried over from 1.0 (issue: searching "black" buried the
 * plain BLACK colour under BLACK GALAXY). Lower = higher up. Exact colour first,
 * then colours that START with the term, then the term as a whole word, then any
 * substring, and only then kode/name matches.
 */
function rankOf(i,q){
  const w=String(warnaLabel(i)).toLowerCase();
  const k=String(i.kode_barang||"").toLowerCase();
  const n=String(i.name||"").toLowerCase();
  if(w===q) return 0;
  if(w.startsWith(q)) return 1;
  if(new RegExp(`(^|[^a-z0-9])${q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}([^a-z0-9]|$)`).test(w)) return 2;
  if(w.includes(q)) return 3;
  if(k.includes(q)) return 4;
  if(n.includes(q)) return 5;
  return 6;
}

// Deterministic tie-breakers: whatever the chosen order, equal keys always fall
// back to warna → kode → ukuran → sku_key, so a colour never moves between polls.
function cmpFor(sort){
  const byName=(a,b)=>String(warnaLabel(a)).localeCompare(String(warnaLabel(b)),"id",{sensitivity:"base"});
  const tail=(a,b)=>byName(a,b)
    || String(a.kode_barang||"").localeCompare(String(b.kode_barang||""),"id",{sensitivity:"base"})
    || sizeKey(a).localeCompare(sizeKey(b))
    || (String(a.sku_key)<String(b.sku_key)?-1:String(a.sku_key)>String(b.sku_key)?1:0);
  if(sort==="kode") return (a,b)=>String(a.kode_barang||"~").localeCompare(String(b.kode_barang||"~"),"id",{sensitivity:"base"})||tail(a,b);
  if(sort==="atp_desc") return (a,b)=>(N(b.atp)-N(a.atp))||tail(a,b);
  if(sort==="atp_asc")  return (a,b)=>(N(a.atp)-N(b.atp))||tail(a,b);
  if(sort==="eta") return (a,b)=>{
    const av=a.nearest_eta?String(a.nearest_eta):"9999-12-31";
    const bv=b.nearest_eta?String(b.nearest_eta):"9999-12-31";
    return av<bv?-1:av>bv?1:tail(a,b);
  };
  return tail; // "warna" — colour A–Z, kode of the same colour adjacent
}

function visibleItems(){
  const q=flt.q.trim().toLowerCase();
  const rows=SUMMARY.items.filter(i=>{
    if(flt.kode && !eq(i.kode_barang,flt.kode)) return false;
    if(flt.warna && !eq(warnaLabel(i),flt.warna)) return false;
    if(flt.th && String(i.th)!==flt.th) return false;
    if(flt.size && sizeKey(i)!==flt.size) return false;
    if(flt.state && i.state!==flt.state) return false;
    // The toggle never hides perlu_produksi: a negative number is the single
    // most valuable row on this page (UX-SPEC §2.3, CONTRACTS §7.5). This
    // mirrors the inherited rule that the zero toggle never hid overbooked rows.
    if(flt.hideZero && i.state!=="perlu_produksi" && N(i.atp)<=0) return false;
    if(q){
      // The raw code stays searchable — PPIC and IT quote it — but the name is
      // what a rep types, so both are in the haystack.
      const hay=[warnaLabel(i),i.warna_name,i.warna_text,i.warna,i.kode_barang,i.name,i.sku_key]
        .filter(Boolean).join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const cmp=cmpFor(flt.sort);
  // While searching, relevance leads and the chosen sort breaks ties, so the
  // exact colour is always the first row rather than somewhere down the list.
  rows.sort(q ? (a,b)=>(rankOf(a,q)-rankOf(b,q))||cmp(a,b) : cmp);
  return rows;
}

function specText(i){
  const parts=[];
  if(i.th!=null) parts.push(num(i.th)+" mm");
  if(i.p!=null&&i.l!=null) parts.push(`${num(i.p)}×${num(i.l)}`);
  return parts.join(" · ");
}

// The headline block (UX-SPEC §2.2), identical on both pages.
function atpBlock(i,flash){
  const atp=N(i.atp), unit=i.unit||"";
  const sub=[`Fisik ${num(i.on_hand)}`,`Dipesan ${num(i.committed)}`];
  if(N(i.adjustment)!==0) sub.push(`Penyesuaian ${N(i.adjustment)>0?"+":"−"}${num(Math.abs(N(i.adjustment)))}`);
  // stale_committed is deliberately EXCLUDED from the arithmetic above, so it
  // gets its own line and must never read as part of that sum.
  const pesananLama=N(i.stale_committed)>0
    ? `<div class="atp-note"><span class="chip umur">Pesanan lama ${num(i.stale_committed)} — tidak dihitung</span></div>` : "";
  // The explanation renders on the row only for the two counter-intuitive
  // states; tersedia and kosong are noise there and the chip already says it.
  let note="";
  if(i.state==="habis"||i.state==="perlu_produksi"){
    // `nearest_eta` is the nearest OUTBOUND commitment date — the soonest a
    // Sales Order takes this stock AWAY. On a `habis` row ("stock exists, all
    // of it promised") the old label "ETA terdekat" read as incoming restock,
    // which is the opposite, and a rep would quote it as a restock date.
    // CONTRACTS "Accepted limits" flagged exactly this. The wording says
    // "pengiriman pesanan" (an order going out) and spells out "stok keluar";
    // PRD §9 reserves the incoming-supply vocabulary ("+ incoming") for later,
    // so nothing here may hint at stock arriving.
    const eta=(i.state==="habis"&&i.nearest_eta)
      ? ` Pengiriman pesanan terdekat ${esc(wibShort(i.nearest_eta))} (stok keluar).`:"";
    note=`<div class="atp-note">${esc(stateNote(i))}${eta}</div>`;
  }
  const m2=i.atp_m2!=null?`<div class="atp-m2">≈ ${num(i.atp_m2)} m²</div>`:"";
  const cls=["atp",atp<0?"neg":"",flash||""].filter(Boolean).join(" ");
  return `<div class="${cls}" aria-label="Bisa dijual ${esc(num(atp))} ${esc(unit)}">${esc(num(atp))}<span class="un">${esc(unit)}</span></div>
    ${m2}
    <div class="atp-sub">${esc(sub.join(" · "))}</div>
    ${pesananLama}${note}`;
}

function renderRows(){
  const tb=$("#tbody"); if(!tb) return;
  const rows=visibleItems();
  const t=SUMMARY.totals||{};
  const meta=$("#invMeta");
  if(meta){
    const filtered=flt.q||flt.kode||flt.warna||flt.th||flt.size||flt.state||flt.hideZero;
    meta.textContent=filtered
      ? `${num(rows.length)} dari ${num(N(t.skus)||SUMMARY.items.length)} SKU`
      : `${num(N(t.skus)||SUMMARY.items.length)} SKU`;
  }
  if(rows.length===0){
    tb.innerHTML=`<tr class="norows"><td colspan="2"><div class="empty">Tidak ada produk yang cocok dengan pencarian ini.</div></td></tr>`;
    return;
  }
  // Only the tbody is replaced, so a poll never moves the page under the reader.
  tb.innerHTML=rows.map(i=>{
    const sub=[i.kode_barang,specText(i)].filter(Boolean).join(" · ");
    return `<tr class="itemrow" data-sku="${esc(i.sku_key)}" tabindex="0" role="button" aria-label="Lihat detail ${esc(warnaLabel(i))}">
      <td class="prod warna">
        <b>${esc(warnaLabel(i))}</b>
        ${sub?`<div class="sub2">${esc(sub)}</div>`:""}
        <div style="margin-top:5px">${stateChip(i.state,false)}</div>
      </td>
      <td class="num">${atpBlock(i,FLASH.get(String(i.sku_key)))}</td>
    </tr>`;
  }).join("");
  FLASH=new Map();   // a flash is shown once, not re-played on every filter tap
  tb.querySelectorAll("tr.itemrow").forEach(r=>{
    const open=()=>openDetail(r.getAttribute("data-sku"));
    r.addEventListener("click",open);
    r.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } });
  });
}

// ── per-SKU detail (CONTRACTS §4.2) ───────────────────────────────────────────
// Tolerant readers: §4.2 names the endpoint's purpose but not its field names,
// so a couple of plausible spellings are accepted rather than one guessed at.
// Nothing is fabricated — an absent section simply renders as empty.
function pickArr(o,...keys){ for(const k of keys){ const v=o&&o[k]; if(Array.isArray(v)) return v; } return []; }
function pick(o,...keys){ for(const k of keys){ const v=o&&o[k]; if(v!=null&&v!=="") return v; } return null; }

function closeDetail(){ $("#dtBg").classList.remove("on"); }
$("#dtBg").addEventListener("click",e=>{ if(e.target.id==="dtBg") closeDetail(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDetail(); });

async function openDetail(skuKey){
  if(!skuKey) return;
  const local=(SUMMARY&&SUMMARY.items.find(x=>eq(x.sku_key,skuKey)))||null;
  $("#dtModal").innerHTML=`<h3>Memuat…</h3>
    <div class="sk lg" style="width:70%;margin-bottom:10px"></div>
    <div class="sk" style="width:90%;margin-bottom:8px"></div>
    <div class="sk" style="width:60%"></div>`;
  $("#dtBg").classList.add("on");
  let j=null,err="";
  try{
    // sku_key contains "|" — it must survive as one path segment.
    const r=await fetch(`/api/stock/sku/${encodeURIComponent(skuKey)}`,{headers:{accept:"application/json"}});
    try{ j=await r.json(); }catch{ j=null; }
    if(!r.ok){ err=(j&&j.error)||(r.status===404?"Kode SKU tidak ditemukan.":"Detail gagal dimuat."); j=null; }
  }catch{ err="Gagal terhubung ke server."; }
  if(!j){
    $("#dtModal").innerHTML=`<div class="empty">${esc(err||"Detail gagal dimuat.")}</div>
      <div class="actions">
        <button class="btn ghost tap" id="dtClose">Tutup</button>
        <button class="btn tap" id="dtRetry">Coba lagi</button>
      </div>`;
    $("#dtRetry").addEventListener("click",()=>openDetail(skuKey));
    $("#dtClose").addEventListener("click",closeDetail);
    return;
  }
  $("#dtModal").innerHTML=renderDetail(j,local,skuKey);
  $("#dtClose").addEventListener("click",closeDetail);
}

// Identity is deliberately NOT rendered on this page. CONTRACTS "Accepted
// limits": *customer names are PPIC-only; withholding is the reversible
// default*. We shipped the irreversible one, so this restores the stated
// default. It matters because there is **no authentication anywhere in this
// app** — the split between /stock and /stock-ppic is URL-only and the actor is
// a name the user types into localStorage — so anything rendered here is
// readable by anyone who loads the URL, not just by a rep.
//
// `so_number` is withheld for the same reason and not merely the names: it is a
// direct cross-reference back into the ERP to the customer this column exists to
// hide, so printing it would leave the withholding as theatre. What a rep needs
// to quote — how much is committed, when it ships, whether it is unscheduled —
// is all still here.
//
// This is a COMMERCIAL decision, not a UI one. To reverse it the product owner
// restores the three cells in this one function; /stock-ppic already renders
// customer and rep and is untouched (PPIC needs them to triage).
function commitTable(list,emptyMsg,withAge){
  if(list.length===0) return `<div class="empty">${esc(emptyMsg)}</div>`;
  return `<div style="overflow-x:auto"><table>
    <thead><tr><th>Pesanan</th><th>Kirim ke Pelanggan</th><th style="text-align:right">Sisa Pesanan</th></tr></thead>
    <tbody>${list.map(r=>{
      const eta=pick(r,"estimate_delivery","eta");
      const d=toDate(eta);
      let age="";
      if(withAge && d){
        const days=Math.floor((Date.now()-d.getTime())/86400000);
        if(days>0){
          const tier=days>365?" ancient":days>180?" old":"";
          age=` <span class="chip umur${tier}">${num(days)} hari</span>`;
        }
      }
      // AMENDMENT 1: an undated line is LIVE and reserving. Saying so is the
      // rep-facing half of that ruling — a bare em dash reads as "no date yet,
      // probably soon", which is the opposite of the truth.
      const undated = r.undated===true || !eta;
      const etaCell = undated
        ? `<span class="chip st-habis">Belum dijadwalkan</span>`
        : `${esc(wibShort(eta))}${age}`;
      return `<tr>
        <td>Pesanan pelanggan</td>
        <td>${etaCell}</td>
        <td class="sisa">${num(pick(r,"qty_balance","qty"))}</td>
      </tr>`;
    }).join("")}</tbody></table></div>`;
}

function renderDetail(j,local,skuKey){
  const it=(j&&typeof j.item==="object"&&j.item)||local||{};
  const atp=N(it.atp), unit=it.unit||"";

  const live =pickArr(j,"live_commitments","live","commitments");
  const stale=pickArr(j,"stale_commitments","stale");
  const adj  =pickArr(j,"adjustments");
  const onh  =pickArr(j,"on_hand_rows","on_hand_detail","fg_rows");

  const sub=[`Fisik ${num(it.on_hand)}`,`Dipesan ${num(it.committed)}`];
  if(N(it.adjustment)!==0) sub.push(`Penyesuaian ${N(it.adjustment)>0?"+":"−"}${num(Math.abs(N(it.adjustment)))}`);

  const onhBlock=onh.length?`<h3 style="font-size:13px;margin:18px 0 6px">Stok Fisik per Lokasi</h3>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Lokasi</th><th>SN</th><th style="text-align:right">Jumlah</th></tr></thead>
      <tbody>${onh.map(r=>`<tr>
        <td>${esc(pick(r,"lokasi","location")||"—")}</td>
        <td>${esc(pick(r,"sn_fg","sn")||"—")}</td>
        <td class="sisa">${num(pick(r,"qty","qty_balance"))}</td>
      </tr>`).join("")}</tbody></table></div>`:"";

  const adjBlock=adj.length?`<h3 style="font-size:13px;margin:18px 0 6px">Penyesuaian</h3>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Waktu</th><th>Alasan</th><th>Petugas</th><th style="text-align:right">Jumlah</th></tr></thead>
      <tbody>${adj.map(r=>{
        const d=N(pick(r,"qty_delta","delta"));
        return `<tr>
          <td>${esc(wib(pick(r,"created_at","at")))}</td>
          <td>${esc(pick(r,"reason")||"—")}</td>
          <td>${esc(pick(r,"actor")||"—")}</td>
          <td class="sisa">${d>0?"+":""}${num(d)}</td>
        </tr>`;
      }).join("")}</tbody></table></div>`:"";

  return `
    <h3>${esc(warnaLabel(it)==="—"?skuKey:warnaLabel(it))}</h3>
    <p class="mp">${esc([it.kode_barang,specText(it)].filter(Boolean).join(" · ")||"—")}<br>Kode SKU ${esc(skuKey)}</p>
    <div style="display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap">
      <div>
        ${stateChip(it.state,true)}
        <div class="atp-note" style="max-width:280px">${esc(stateNote(it))}</div>
      </div>
      <div style="text-align:right">
        <div class="atp ${atp<0?"neg":""}" aria-label="Bisa dijual ${esc(num(atp))} ${esc(unit)}">${esc(num(atp))}<span class="un">${esc(unit)}</span></div>
        ${it.atp_m2!=null?`<div class="atp-m2">≈ ${num(it.atp_m2)} m²</div>`:""}
        <div class="atp-sub">${esc(sub.join(" · "))}</div>
      </div>
    </div>
    <h3 style="font-size:13px;margin:18px 0 6px">Sales Order yang Mengikat Stok Ini</h3>
    ${commitTable(live,"Belum ada Sales Order aktif untuk SKU ini.",false)}
    <h3 style="font-size:13px;margin:18px 0 6px">Pesanan Lama</h3>
    <div class="hint">Tidak dihitung dalam Bisa Dijual. Menunggu ditinjau Petugas PPIC.</div>
    ${commitTable(stale,"Tidak ada pesanan lama.",true)}
    ${onhBlock}
    ${adjBlock}
    <div class="foot">Halaman ini hanya menampilkan angka. Untuk memesan, buat Sales Order di ERP seperti biasa.</div>
    <div class="actions"><button class="btn tap" id="dtClose">Tutup</button></div>`;
}

// ── poll every 30s (R10) ──────────────────────────────────────────────────────
renderAll();
loadSummary();
loadSync();
setInterval(loadSummary,30000);
setInterval(loadSync,60000);
</script>
</body>
